<div class="wrap">

</div>

// ---------- SOUND EFFECTS (Web Audio, no files) ----------
let ctx = null;
function tone(freq, start, dur, type, vol) {
  if (!soundOn) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    const tt = ctx.currentTime + start;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, tt);
    g.gain.setValueAtTime(0.0001, tt);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, tt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, tt + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(tt); o.stop(tt + dur + 0.05);
  } catch (e) {}
}
const sfx = {
  click()   { tone(660, 0, 0.08, 'triangle', 0.08); },
  correct() { tone(660, 0, 0.12, 'triangle'); tone(880, 0.1, 0.12, 'triangle'); tone(1320, 0.2, 0.25, 'triangle'); },
  wrong()   { tone(220, 0, 0.18, 'sawtooth', 0.12); tone(160, 0.16, 0.3, 'sawtooth', 0.12); },
  finish()  { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, 'triangle')); },
  low()     { [392, 330, 262].forEach((f, i) => tone(f, i * 0.16, 0.3, 'triangle', 0.14)); }
};

  if (id === 'start') $('hiName').textContent = player;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- SHARED LEADERBOARD ----------
// Backend 1: Firebase Realtime Database (REST) - para sa GitHub Pages / kahit anong website.
// Backend 2: Claude artifact "db" - kapag nakabukas sa loob ng Claude.
// Backend 3: localStorage - sa device lang.
const FB_URL = "";
let db = null, sharedRows = [], shareState = 'local';   // local | live | readonly
async function fbPull() {
  try {
    const r = await fetch(FB_URL + '/scores.json');
    if (!r.ok) throw new Error(r.status);
    const o = (await r.json()) || {};
    sharedRows = Object.keys(o).map(k => Object.assign({}, o[k], { id: k }));
    if (shareState === 'local') shareState = 'live';
  } catch (e) { if (!sharedRows.length) shareState = 'local'; }
  refreshBoards();
}
async function initShared() {
  if (FB_URL) {
    fbPull();
    setInterval(fbPull, 10000);
    return;
  }
  try {
    const d = await (window.claude && window.claude.use ? window.claude.use('db') : null);
    if (!d) return;
    db = d;
    db.collection('scores').orderBy('points', 'desc').limit(300).onSnapshot(
      snap => {
        sharedRows = snap.docs.map(x => Object.assign({}, x.data(), { id: x.id }));
        if (shareState === 'local') shareState = 'live';
        refreshBoards();
      },
      () => { shareState = 'local'; refreshBoards(); }
    );
  } catch (e) {}
}
function allRows() {
  const seen = new Map();
  sharedRows.concat(getLocalBoard()).forEach(r => { if (r && r.id && !seen.has(r.id)) seen.set(r.id, r); });
  return Array.from(seen.values());
}
function statusText() { return t(shareState === 'live' ? 'stLive' : shareState === 'readonly' ? 'stReadonly' : 'stLocal'); }
function refreshBoards() {
  $('statusBoard').textContent = statusText();
  $('statusResult').textContent = statusText();
  if (visible('board')) showBoard(currentTab);
  if (visible('result') && lastEntry) renderResultBoard();
}

// ---------- LEADERBOARD VIEW ----------
const esc = x => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function boardKey(e) { return e.subject + (e.lesson && e.lesson !== 'all' ? ' · ' + e.lesson : ''); }
function renderTable(rows, highlightId, showLesson) {
  if (!rows.length) return '<p class="empty">' + esc(t('empty')) + '</p>';
  let h = '<table><tr><th>#</th><th>' + esc(t('thName')) + '</th>' + (showLesson ? '<th>' + esc(t('thLesson')) + '</th>' : '') +
          '<th class="num">' + esc(t('thCorrect')) + '</th><th class="num">' + esc(t('thPts')) + '</th></tr>';
  rows.forEach((r, i) => {
    const medal = ['🥇', '🥈', '🥉'][i] || (i + 1);
    h += '<tr' + (r.id === highlightId ? ' class="me"' : '') + '><td>' + medal + '</td><td>' + esc(r.name) + '</td>' +
      (showLesson ? '<td>' + esc(r.lesson === 'all' ? t('all') : r.lesson) + '</td>' : '') +
      '<td class="num">' + esc(r.correct) + '/' + esc(r.total) + '</td><td class="num">' + esc(r.points) + '</td></tr>';
  });
  return h + '</table>';
}
function showBoard(tab) {
  currentTab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('ghost', b.dataset.tab !== tab));
  const rows = allRows().filter(e => e.subject === tab).sort((a, b) => b.points - a.points).slice(0, 15);
  $('boardTable').innerHTML = renderTable(rows, null, tab === 'GENSCI');
  $('statusBoard').textContent = statusText();
}
function renderResultBoard() {
  const same = allRows().filter(e => boardKey(e) === boardKey(lastEntry)).sort((a, b) => b.points - a.points);
  const rank = same.findIndex(e => e.id === lastEntry.id) + 1;
  $('lbTitle').textContent = t('lbTitle', { k: boardKey(lastEntry), r: rank });
  const top = same.slice(0, 10);
  if (rank > 10) top.push(lastEntry);
  $('resultBoard').innerHTML = renderTable(top, lastEntry.id, false);
  $('statusResult').textContent = statusText();
}

function chooseSubject(key) {

function buildLessonList(selected) {
  lesson = selected;
  $('beginGensci').disabled = !selected;
  const counts = {};
  BANKS.GENSCI.forEach(q => counts[q.src] = (counts[q.src] || 0) + 1);

// ---------- QUIZ ----------
function startWith(questions) {
  set = shuffle(questions).map(q => ({ ...q, choices: shuffle([q.a].concat(q.wrong)) }));
  idx = 0; score = 0; wrongs = []; points = 0; streak = 0;
  show('quiz');
  render();
}
function startFresh() {
  let pool = BANKS[subject];
  if (lesson && lesson !== 'all') pool = pool.filter(q => q.src === lesson);
  const pick = subject === 'GENSCI' ? $('countGensci').value : $('countFil2').value;
  let qs = shuffle(pool);
  if (pick !== 'all') qs = qs.slice(0, Number(pick));
  startWith(qs);
}
function label() { return subject + (lesson && lesson !== 'all' ? ' · ' + lesson : ''); }

function render() {
  const q = set[idx];
  answered = false;
  $('subj').textContent = label();
  $('pos').textContent = (idx + 1) + ' / ' + set.length;
  $('tally').textContent = t('correctCount', { n: score });
  $('points').textContent = t('pts', { n: points });
  qStart = performance.now();
  $('fill').style.width = (idx / set.length * 100) + '%';
  $('qtext').textContent = q.q;
  $('fb').className = 'feedback';
  $('fb').innerHTML = '';
  $('next').classList.add('hidden');
  const box = $('choices');
  box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    const k = document.createElement('span'); k.className = 'key'; k.textContent = i + 1;
    const tx = document.createElement('span'); tx.textContent = c;
    b.append(k, tx);
    b.onclick = () => answer(b, c);
    box.append(b);
  });
}

function answer(btn, choice) {
  if (answered) return;
  answered = true;
  const q = set[idx];
  const ok = choice === q.a;
  let gained = 0;
  if (ok) {
    score++; streak++;
    const secs = (performance.now() - qStart) / 1000;
    const speed = Math.max(0, 1 - secs / TIME_LIMIT);
    gained = 500 + Math.round(400 * speed) + Math.min(streak - 1, 5) * 20;
    points += gained;
    sfx.correct();
  } else { wrongs.push(q); streak = 0; sfx.wrong(); }
  $('choices').querySelectorAll('.choice').forEach(b => {
    b.disabled = true;
    const txt = b.lastChild.textContent;
    if (txt === q.a) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb = $('fb');
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  fb.textContent = ok ? t('right', { n: gained }) + (streak > 1 ? '  ·  ' + t('streak', { n: streak }) : '') : t('wrong', { a: q.a });
  const src = document.createElement('div'); src.className = 'src'; src.textContent = t('lessonLbl', { s: q.src });
  fb.append(src);
  $('tally').textContent = t('correctCount', { n: score });
  $('points').textContent = t('pts', { n: points });
  $('fill').style.width = ((idx + 1) / set.length * 100) + '%';
  $('next').textContent = t(idx + 1 < set.length ? 'next' : 'seeScore');
  $('next').classList.remove('hidden');
  $('next').focus();
}
function next() {
  if (!answered) return;
  idx++;
  if (idx < set.length) render(); else finish();
}

function finishText() {
  const pct = Math.round(score / set.length * 100);
  $('scoreLabel').textContent = label() + ' · ' + t('score');
  $('final').textContent = score + ' / ' + set.length;
  $('msg').textContent = pct + '% — ' + t(pct >= 90 ? 'msgHigh' : pct >= 75 ? 'msgMid' : 'msgLow');
  $('ptsLine').textContent = t('ptsLine', { name: player, n: points });
  $('missedTitle').textContent = t('missedTitle');
  if (lastEntry) renderResultBoard();
}
async function finish() {
  const pct = Math.round(score / set.length * 100);
  $('retryWrong').classList.toggle('hidden', wrongs.length === 0);
  pct >= 75 ? sfx.finish() : sfx.low();
  const entry = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), name: player, subject: subject, lesson: lesson || 'all',
                  points: points, correct: score, total: set.length, date: new Date().toISOString().slice(0, 10), ts: Date.now() };
  lastEntry = entry;
  const local = getLocalBoard(); local.push(entry); saveLocalBoard(local.slice(-300));
  const m = $('missed');
  m.innerHTML = '';
  wrongs.forEach(q => {
    const d = document.createElement('div');
    d.textContent = q.q;
    const s = document.createElement('span'); s.textContent = q.a + '  ·  ' + q.src;
    d.append(s);
    m.append(d);
  });
  $('missedTitle').classList.toggle('hidden', wrongs.length === 0);
  finishText();
  show('result');
  if (FB_URL) {
    try {
      const r = await fetch(FB_URL + '/scores/' + encodeURIComponent(entry.id) + '.json',
        { method: 'PUT', body: JSON.stringify(entry) });
      if (!r.ok) throw new Error(r.status);
      sharedRows.push(entry); shareState = 'live';
    } catch (e) { shareState = 'readonly'; }
    refreshBoards();
    fbPull();
  } else if (db) {
    try { await db.collection('scores').doc(entry.id).set(entry); if (shareState === 'local') shareState = 'live'; }
    catch (e) { shareState = 'readonly'; }
    refreshBoards();
  }
}

$('home').onclick = goHome;
$('nameInput').addEventListener('input', () => $('nameGo').disabled = !$('nameInput').value.trim());
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); setName(); } });
$('nameGo').onclick = setName;
$('changeName').onclick = () => show('nameScreen');
$('openBoard').onclick = () => { showBoard(currentTab); show('board'); };
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showBoard(b.dataset.tab));
document.querySelectorAll('.soundToggle').forEach(b => b.onclick = () => { soundOn = !soundOn; store.set('rq_sound', soundOn); refreshSoundLabels(); b.blur(); sfx.click(); });
document.querySelectorAll('.langSel').forEach(s => s.onchange = () => setLang(s.value));
document.querySelectorAll('.subject, .back').forEach(b => b.addEventListener('click', () => sfx.click()));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (visible('start')) {
    if (e.key === '1') chooseSubject('FIL2');
    else if (e.key === '2') chooseSubject('GENSCI');
  } else if (visible('fil2Setup')) {
    if (e.key === 'Enter') { e.preventDefault(); startFresh(); }
  } else if (visible('gensciSetup')) {
    if (e.key === 'Enter' && lesson) { e.preventDefault(); startFresh(); }
  } else if (visible('quiz')) {
    if (!answered && /^[1-4]$/.test(e.key)) {
      const b = $('choices').querySelectorAll('.choice')[Number(e.key) - 1];
      if (b) b.click();
    } else if (answered && e.key === 'Enter') {
      e.preventDefault(); next();
    }
  }
});

applyLang();
show(player ? 'start' : 'nameScreen');
refreshBoards();
initShared();
</script>
</body></html>
